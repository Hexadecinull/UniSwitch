version: 2
updates:
  # pnpm-lock.yaml is detected automatically under the "npm" ecosystem
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    ignore:
      # typescript-eslint doesn't support TS 7 yet (no stable programmatic API
      # until TS 7.1), see https://github.com/typescript-eslint/typescript-eslint/issues/12518.
      # Remove this once typescript-eslint adds TS 7 support.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
